  shared_preferences: ^2.5.3
  hive: ^2.2.3
  path_provider: ^2.0.16
  open_filex: ^4.0.2
  permission_handler: ^12.0.1

  # Validation
  email_validator: ^3.0.0

  # Calendar
  table_calendar: ^3.2.0

  # Media & PDF
  image_picker: ^1.2.0
  pdf: ^3.11.0
  printing: ^5.13.0

  # URL & Notifications
  url_launcher: ^6.3.2
  overlay_support: ^2.1.0

  # Localization
