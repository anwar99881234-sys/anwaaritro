name: rehlatuk
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_animate: ^4.5.0


  # Add share_plus here
  share_plus: ^12.0.1


  # Country Packages
  country_picker: ^2.0.26

  # Firebase
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.2
  firebase_storage: ^13.0.2
  cloud_functions: ^6.0.2
  uuid: ^4.5.1
  timeago: ^3.3.0

